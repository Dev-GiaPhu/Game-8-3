<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-3: Hành Trình Hái Hoa</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pattaya&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff4757; --sweet: #ffafbd; --bg: #fff5f6; }
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: #ffc0cb; overflow: hidden; touch-action: none; }
        
        #setup-screen {
            position: fixed; inset: 0; background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
        }
        .card { background: rgba(255, 255, 255, 0.9); padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; backdrop-filter: blur(10px); }
        h1 { color: var(--primary); font-family: 'Pattaya', sans-serif; margin-bottom: 10px; font-size: 32px; text-shadow: 2px 2px white; }
        input, textarea { width: 90%; padding: 12px; margin: 8px 0; border: 2px solid #ffcad4; border-radius: 15px; font-family: inherit; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,71,87,0.2); }
        
        .upload-row { display: flex; justify-content: space-around; margin: 15px 0; }
        .upload-box { width: 85px; height: 85px; border: 3px dashed var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: white; cursor: pointer; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; }
        .upload-box span { font-size: 10px; color: var(--primary); font-weight: bold; padding: 5px; }

        button#start-btn { background: var(--primary); color: white; border: none; padding: 15px 45px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 10px; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,71,87,0.4); }
        button#start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(255,71,87,0.5); }

        #result-screen {
            position: fixed; inset: 0; background: rgba(255, 240, 243, 0.98); z-index: 200;
            display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
        }
        .avatar-group { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .wish-box { background: white; border: 2px solid #ffcad4; padding: 25px; border-radius: 20px; max-width: 400px; line-height: 1.6; font-style: italic; color: #444; position: relative; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="card">
        <h1>🌹 Rose Run 8-3 🌹</h1>
        <input type="text" id="senderName" placeholder="Tên bạn...">
        <input type="text" id="receiverName" placeholder="Tên người ấy...">
        <div class="upload-row">
            <div class="upload-box" onclick="document.getElementById('f1').click()">
                <input type="file" id="f1" hidden accept="image/*" onchange="previewImg(this, 'p1')">
                <img id="p1" style="display:none">
                <span id="t1">Ảnh Bạn</span>
            </div>
            <div class="upload-box" onclick="document.getElementById('f2').click()">
                <input type="file" id="f2" hidden accept="image/*" onchange="previewImg(this, 'p2')">
                <img id="p2" style="display:none">
                <span id="t2">Ảnh Cô Ấy</span>
            </div>
        </div>
        <textarea id="wishText" rows="3" placeholder="Lời chúc ngọt ngào..."></textarea>
        <button id="start-btn">PLAY</button>
        <p style="font-size: 11px; color: #666; margin-top: 10px;">PC: Space/S | Mobile: Vuốt Lên/Xuống</p>
    </div>
</div>

<div id="result-screen">
    <div class="avatar-group">
        <img id="res-sender" class="avatar">
        <div style="font-size: 30px;">❤️</div>
        <img id="res-receiver" class="avatar">
    </div>
    <h2 id="res-announcement" style="color: var(--primary); font-family: 'Pattaya';"></h2>
    <div class="wish-box" id="res-wish"></div>
    <div style="margin-top: 25px; display: flex; gap: 15px;">
        <button onclick="restartGame()" style="padding: 10px 25px; border-radius: 20px; border: none; background: #ddd; cursor: pointer;">Chơi lại</button>
        <button onclick="alert('Hãy chụp màn hình để lưu nhé!')" style="padding: 10px 25px; border-radius: 20px; border: none; background: var(--primary); color: white; cursor: pointer;">Lưu Ảnh</button>
    </div>
</div>

<script>
    let senderImgBase64 = localStorage.getItem('sImg') || "";
    let receiverImgBase64 = localStorage.getItem('rImg') || "";
    let score = 0;

    // Load lại dữ liệu cũ nếu có
    window.onload = () => {
        if(localStorage.getItem('sName')) document.getElementById('senderName').value = localStorage.getItem('sName');
        if(localStorage.getItem('rName')) document.getElementById('receiverName').value = localStorage.getItem('rName');
        if(localStorage.getItem('wish')) document.getElementById('wishText').value = localStorage.getItem('wish');
        if(senderImgBase64) { document.getElementById('p1').src = senderImgBase64; document.getElementById('p1').style.display='block'; document.getElementById('t1').style.display='none'; }
        if(receiverImgBase64) { document.getElementById('p2').src = receiverImgBase64; document.getElementById('p2').style.display='block'; document.getElementById('t2').style.display='none'; }
    }

    function previewImg(input, imgId) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById(imgId).src = e.target.result;
                document.getElementById(imgId).style.display = "block";
                document.getElementById('t' + imgId.charAt(1)).style.display = "none";
                if(imgId === 'p1') { senderImgBase64 = e.target.result; localStorage.setItem('sImg', e.target.result); }
                if(imgId === 'p2') { receiverImgBase64 = e.target.result; localStorage.setItem('rImg', e.target.result); }
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        backgroundColor: '#fff0f3',
        physics: { default: 'arcade', arcade: { gravity: { y: 1800 }, debug: false } },
        scene: { preload: preload, create: create, update: update }
    };

    let game, player, ground, obstacles, flowers, scoreText, cursors, keys;
    let groundY = window.innerHeight / 1.6;

    document.getElementById('start-btn').onclick = () => {
        if(!senderImgBase64) return alert("Cần ảnh của bạn để làm nhân vật!");
        localStorage.setItem('sName', document.getElementById('senderName').value);
        localStorage.setItem('rName', document.getElementById('receiverName').value);
        localStorage.setItem('wish', document.getElementById('wishText').value);
        document.getElementById('setup-screen').style.display = 'none';
        game = new Phaser.Game(config);
    };

    function preload() {
        this.load.image('rose', 'https://cdn-icons-png.flaticon.com/512/3405/3405900.png');
    }

    function create() {
        const scene = this;
        score = 0;

        // Player setup
        const pSize = 100;
        const pCanvas = document.createElement('canvas');
        pCanvas.width = pSize; pCanvas.height = pSize;
        const ctx = pCanvas.getContext('2d');
        ctx.beginPath(); ctx.arc(pSize/2, pSize/2, pSize/2, 0, Math.PI*2); ctx.clip();
        let img = new Image(); img.src = senderImgBase64;
        img.onload = () => { scene.textures.addCanvas('pTex', pCanvas); player.setTexture('pTex'); ctx.drawImage(img,0,0,pSize,pSize); };

        player = this.physics.add.sprite(150, groundY - 100, null).setDisplaySize(70, 70);
        player.setCircle(50);
        player.setCollideWorldBounds(true);

        // Ground in Middle
        ground = this.add.rectangle(0, groundY, config.width * 2, 20, 0xff8fa3).setOrigin(0);
        this.physics.add.existing(ground, true);
        this.physics.add.collider(player, ground);

        obstacles = this.physics.add.group();
        flowers = this.physics.add.group();

        // Controls
        cursors = this.input.keyboard.createCursorKeys();
        keys = this.input.keyboard.addKeys({ 'S': Phaser.Input.Keyboard.KeyCodes.S });

        // Swipe logic
        this.input.on('pointerup', (pointer) => {
            let swipeTime = pointer.upTime - pointer.downTime;
            let swipeY = pointer.upY - pointer.downY;
            if (swipeTime < 500) {
                if (swipeY < -50 && player.body.onFloor()) player.setVelocityY(-700); // Swipe Up
            }
        });

        // Loop
        this.time.addEvent({ delay: 1500, callback: () => {
            let isHigh = Math.random() > 0.5;
            let obs = obstacles.create(config.width + 50, isHigh ? groundY - 120 : groundY - 30, null);
            obs.setDisplaySize(isHigh ? 60 : 40, isHigh ? 30 : 50);
            obs.setTint(isHigh ? 0x74b9ff : 0x2f3542);
            obs.body.setAllowGravity(false);
            obs.setVelocityX(-400 - (score * 10));
        }, loop: true });

        this.time.addEvent({ delay: 1000, callback: () => {
            let f = flowers.create(config.width + 50, groundY - 100 - Math.random()*150, 'rose');
            f.setDisplaySize(40, 40); f.body.setAllowGravity(false); f.setVelocityX(-400);
        }, loop: true });

        this.physics.add.overlap(player, obstacles, gameOver, null, this);
        this.physics.add.overlap(player, flowers, (p, f) => { f.destroy(); score++; scoreText.setText('🌹: ' + score); }, null, this);
        scoreText = this.add.text(20, 20, '🌹: 0', { fontSize: '30px', fill: '#ff4757', fontWeight: 'bold' });
    }

    function update() {
        const pointer = this.input.activePointer;
        // PC Controls
        if (cursors.space.isDown && player.body.onFloor()) player.setVelocityY(-700);
        
        // Crouch (S key or Swipe Down/Long Press Down)
        if (keys.S.isDown || (pointer.isDown && pointer.y > groundY)) {
            player.setDisplaySize(70, 35);
            player.setY(groundY - 15);
        } else {
            player.setDisplaySize(70, 70);
        }

        obstacles.children.iterate(o => { if(o && o.x < -50) o.destroy(); });
    }

    function gameOver() {
        this.physics.pause();
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('finalScore').innerText = score;
        document.getElementById('res-sender').src = senderImgBase64;
        document.getElementById('res-receiver').src = receiverImgBase64 || senderImgBase64;
        document.getElementById('res-announcement').innerText = `${localStorage.getItem('sName') || 'Anh'} đã hái ${score} đóa hồng tặng ${localStorage.getItem('rName') || 'Em'}`;
        document.getElementById('res-wish').innerText = localStorage.getItem('wish');
        game.destroy(true);
    }

    function restartGame() {
        document.getElementById('result-screen').style.display = 'none';
        game = new Phaser.Game(config);
    }
</script>
</body>
</html>
