<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-3: Rose Run - Món Quà Yêu Thương</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pattaya&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff4757; --bg: #fff5f6; }
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: #ffc0cb; overflow: hidden; touch-action: none; }
        #setup-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        input, textarea { width: 90%; padding: 12px; margin: 8px 0; border: 2px solid #ffcad4; border-radius: 12px; font-family: inherit; }
        .upload-row { display: flex; justify-content: space-around; margin: 15px 0; }
        .upload-box { width: 85px; height: 85px; border: 3px dashed var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; background: white; cursor: pointer; position: relative; }
        .upload-box img { width: 100%; height: 100%; object-fit: cover; }
        .upload-box span { font-size: 10px; color: var(--primary); font-weight: bold; position: absolute; }
        button.main-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        #result-screen { position: fixed; inset: 0; background: #fff0f3; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .wish-box { background: white; border: 2px solid #ffcad4; padding: 20px; border-radius: 20px; max-width: 400px; margin: 15px 0; font-style: italic; }
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div class="card">
        <h1 style="color:var(--primary); font-family:'Pattaya'">🌹 Rose Run 8-3 🌹</h1>
        <input type="text" id="senderName" placeholder="Tên bạn...">
        <input type="text" id="receiverName" placeholder="Tên cô ấy...">
        <div class="upload-row">
            <div class="upload-box" onclick="document.getElementById('f1').click()">
                <input type="file" id="f1" hidden accept="image/*" onchange="previewImg(this, 'p1')">
                <img id="p1" style="display:none">
                <span id="t1">Ảnh Bạn</span>
            </div>
            <div class="upload-box" onclick="document.getElementById('f2').click()">
                <input type="file" id="f2" hidden accept="image/*" onchange="previewImg(this, 'p2')">
                <img id="p2" style="display:none">
                <span id="t2">Ảnh Cô Ấy</span>
            </div>
        </div>
        <textarea id="wishText" rows="3" placeholder="Lời nhắn gửi..."></textarea>
        <button class="main-btn" onclick="startGame()">BẮT ĐẦU CHƠI</button>
    </div>
</div>

<div id="result-screen">
    <div id="capture-area" style="padding:20px; text-align:center">
        <div style="display:flex; align-items:center; justify-content:center; gap:10px">
            <img id="res-sender" class="avatar">
            <div style="font-size: 24px; color: var(--primary); font-weight:bold">🌹 x <span id="finalScore">0</span></div>
            <img id="res-receiver" class="avatar">
        </div>
        <h3 id="res-announcement" style="color:var(--primary); font-family:'Pattaya'"></h3>
        <div class="wish-box" id="res-wish"></div>
    </div>
    <div class="action-btns">
        <button onclick="location.reload()" style="padding:10px; border-radius:20px; border:none">Chơi lại</button>
        <button onclick="saveImage()" style="padding:10px; border-radius:20px; border:none; background:var(--primary); color:white">Lưu Ảnh</button>
        <button onclick="shareLink()" style="padding:10px; border-radius:20px; border:none; background:#4cd137; color:white">Copy Link</button>
        <button onclick="document.getElementById('setup-screen').style.display='flex'" style="padding:10px; border-radius:20px; border:none; background:#00a8ff; color:white">Menu</button>
    </div>
</div>

<script>
    let senderImgBase64 = localStorage.getItem('sImg') || "";
    let receiverImgBase64 = localStorage.getItem('rImg') || "";
    let score = 0;

    // Load data
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if(params.has('s')) {
            document.getElementById('senderName').value = params.get('s');
            document.getElementById('receiverName').value = params.get('r');
            document.getElementById('wishText').value = params.get('w');
        } else {
            document.getElementById('senderName').value = localStorage.getItem('sName') || "";
            document.getElementById('receiverName').value = localStorage.getItem('rName') || "";
            document.getElementById('wishText').value = localStorage.getItem('wish') || "";
        }
        if(senderImgBase64) { document.getElementById('p1').src = senderImgBase64; document.getElementById('p1').style.display='block'; document.getElementById('t1').style.display='none'; }
        if(receiverImgBase64) { document.getElementById('p2').src = receiverImgBase64; document.getElementById('p2').style.display='block'; document.getElementById('t2').style.display='none'; }
    };

    function previewImg(input, imgId) {
        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById(imgId).src = e.target.result;
                document.getElementById(imgId).style.display = "block";
                document.getElementById('t' + imgId.charAt(1)).style.display = "none";
                let key = imgId === 'p1' ? 'sImg' : 'rImg';
                if(imgId === 'p1') senderImgBase64 = e.target.result; else receiverImgBase64 = e.target.result;
                localStorage.setItem(key, e.target.result);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function shareLink() {
        const s = encodeURIComponent(document.getElementById('senderName').value);
        const r = encodeURIComponent(document.getElementById('receiverName').value);
        const w = encodeURIComponent(document.getElementById('wishText').value);
        const url = `${window.location.origin}${window.location.pathname}?s=${s}&r=${r}&w=${w}`;
        navigator.clipboard.writeText(url).then(() => alert("Đã copy link gửi tặng!"));
    }

    function saveImage() {
        html2canvas(document.getElementById('capture-area')).then(canvas => {
            let link = document.createElement('a'); link.download = '8-3.png'; link.href = canvas.toDataURL(); link.click();
        });
    }

    // GAME LOGIC
    let game;
    function startGame() {
        if(!senderImgBase64) return alert("Vui lòng tải ảnh của bạn!");
        localStorage.setItem('sName', document.getElementById('senderName').value);
        localStorage.setItem('rName', document.getElementById('receiverName').value);
        localStorage.setItem('wish', document.getElementById('wishText').value);
        document.getElementById('setup-screen').style.display = 'none';
        if(game) game.destroy(true);
        game = new Phaser.Game(config);
    }

    const config = {
        type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
        backgroundColor: '#fff0f3',
        physics: { default: 'arcade', arcade: { gravity: { y: 2200 } } },
        scene: { preload: preload, create: create, update: update }
    };

    function preload() {
        this.load.image('rose', 'https://cdn-icons-png.flaticon.com/512/3405/3405900.png');
    }

    let player, ground, obstacles, flowers, scoreText;
    let groundY = window.innerHeight / 2; // Đưa mặt đường ra chính giữa

    function create() {
        const scene = this; score = 0;
        
        // Render Player Image
        const pSize = 100;
        const pCanvas = document.createElement('canvas');
        pCanvas.width = pSize; pCanvas.height = pSize;
        const ctx = pCanvas.getContext('2d');
        ctx.beginPath(); ctx.arc(pSize/2, pSize/2, pSize/2, 0, Math.PI*2); ctx.clip();
        let img = new Image(); img.onload = () => { 
            ctx.drawImage(img, 0, 0, pSize, pSize);
            scene.textures.addCanvas('pTex', pCanvas);
            player.setTexture('pTex');
        }; img.src = senderImgBase64;

        player = this.physics.add.sprite(150, groundY - 100, null).setDisplaySize(80, 80);
        player.setCircle(50);
        player.setCollideWorldBounds(true);

        // Mặt đường trang trí đẹp hơn
        this.add.rectangle(0, groundY, config.width, 10, 0xff4757).setOrigin(0);
        ground = this.add.rectangle(0, groundY + 10, config.width, 100, 0xffb6c1).setOrigin(0);
        this.physics.add.existing(ground, true);
        this.physics.add.collider(player, ground);

        obstacles = this.physics.add.group();
        flowers = this.physics.add.group();

        // Spawn logic: Đảm bảo không chồng lấn
        this.time.addEvent({ 
            delay: 1800, 
            callback: () => {
                let type = Math.random();
                let obs;
                if (type > 0.4) { // 60% Thùng gỗ/Đá nằm dưới đất
                    obs = obstacles.create(config.width + 50, groundY - 35, null);
                    obs.setDisplaySize(50, 50);
                    obs.setTint(0x2f3542);
                } else { // 40% Chim bay ở trên
                    obs = obstacles.create(config.width + 50, groundY - 130, null);
                    obs.setDisplaySize(60, 35);
                    obs.setTint(0x0984e3);
                }
                obs.body.setAllowGravity(false);
                obs.setVelocityX(-450 - (score * 5));
            }, 
            loop: true 
        });

        this.time.addEvent({
            delay: 1200,
            callback: () => {
                let f = flowers.create(config.width + 50, groundY - 100 - Math.random()*150, 'rose');
                f.setDisplaySize(40, 40); f.body.setAllowGravity(false); f.setVelocityX(-450);
            },
            loop: true
        });

        this.physics.add.overlap(player, obstacles, gameOver, null, this);
        this.physics.add.overlap(player, flowers, (p, f) => { f.destroy(); score++; scoreText.setText('🌹: ' + score); }, null, this);
        scoreText = this.add.text(20, 20, '🌹: 0', { fontSize: '30px', fill: '#ff4757', fontWeight: 'bold' });
    }

    function update() {
        const pointer = this.input.activePointer;
        const space = this.input.keyboard.addKey('SPACE');
        const keyS = this.input.keyboard.addKey('S');

        // Điều khiển Nhảy
        if ((space.isDown || (pointer.isDown && pointer.y < groundY - 100)) && player.body.onFloor()) {
            player.setVelocityY(-850);
        }
        
        // Điều khiển Thu nhỏ (Né chim)
        if (keyS.isDown || (pointer.isDown && pointer.y > groundY)) {
            player.setDisplaySize(80, 45);
            player.setY(groundY - 20);
        } else {
            player.setDisplaySize(80, 80);
        }
    }

    function gameOver() {
        this.physics.pause();
        document.getElementById('result-screen').style.display = 'flex';
        document.getElementById('finalScore').innerText = score;
        document.getElementById('res-sender').src = senderImgBase64;
        document.getElementById('res-receiver').src = receiverImgBase64 || senderImgBase64;
        document.getElementById('res-announcement').innerText = `${localStorage.getItem('sName')} hái tặng ${localStorage.getItem('rName')} ${score} đóa hồng!`;
        document.getElementById('res-wish').innerText = localStorage.getItem('wish');
        game.destroy(true);
    }
</script>
</body>
</html>
